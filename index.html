<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F2EFE7" />
    <script>
      // Light is the default; apply dark before first paint only when the
      // guest chose it with the header toggle.
      (function () {
        try {
          var t = localStorage.getItem("theme") === "dark" ? "dark" : "light";
          document.documentElement.setAttribute("data-theme", t);
          if (t === "dark") {
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute("content", "#161616");
          }
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="https://zafhylwgfbncranqiosc.supabase.co/storage/v1/object/public/branding/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Flakes@50" />
    <title>Flakes@50 Lagos Edition</title>
    <link rel="preload" as="image" href="/splash/folake-feathers.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Petrona:ital,wght@0,100..900;1,100..900&family=Bricolage+Grotesque:opsz,wght@12..96,300..800&display=swap" />
    <style>
      /* Launch screen: the portrait full-bleed for three seconds while the
         app loads underneath, then a fade. Plain CSS so it paints before
         any JavaScript arrives. */
      /* The splash sits at the top of the page rather than fixed over it:
         Safari (iOS 26) paints its bars solid in the background colour of a
         fixed element that touches them, but lets ordinary page content
         show through. It runs the full screen height so the photo carries
         on behind the bottom toolbar; the copy stays above it. The page
         ground takes the photo's top-edge colour for the status bar. */
      html.splashing { overflow: hidden; background: #9EC9BE; }
      html.splashing .app-nav { display: none; }
      #splash {
        position: absolute; top: 0; left: 0; right: 0; height: 100lvh;
        z-index: 9999; overflow: hidden;
        background: #9EC9BE; color: #FBF3EE; cursor: pointer;
        font-family: "Bricolage Grotesque", system-ui, sans-serif;
        transition: opacity 0.6s ease, visibility 0.6s;
      }
      #splash.out { opacity: 0; visibility: hidden; }
      #splash img {
        position: absolute; inset: 0; width: 100%; height: 100%;
        object-fit: cover; object-position: 20% 50%;
        animation: splash-zoom 3.6s cubic-bezier(0.2, 0.6, 0.2, 1) both;
      }
      #splash .veil {
        position: absolute; inset: 0;
        background: linear-gradient(180deg, rgba(15, 45, 41, 0) 40%, rgba(15, 45, 41, 0.7) 66%, rgba(15, 45, 41, 0.94) 100%);
      }
      #splash .copy {
        position: absolute; left: 0; right: 0; bottom: calc(100lvh - 100svh);
        max-width: 480px; margin: 0 auto;
        padding: 0 28px calc(36px + env(safe-area-inset-bottom));
      }
      #splash .eyebrow, #splash .dates {
        font-size: 10.5px; font-weight: 600; letter-spacing: 0.24em; text-transform: uppercase;
      }
      #splash .eyebrow { opacity: 0.85; }
      #splash .mark {
        margin: 10px 0 6px; font-family: "Petrona", Georgia, serif;
        font-size: clamp(52px, 15vw, 72px); line-height: 1; letter-spacing: -0.02em; font-weight: 400;
      }
      #splash .mark span { color: #F7B9C6; }
      #splash .dates { letter-spacing: 0.2em; font-weight: 500; opacity: 0.85; }
      #splash .bar { margin-top: 26px; height: 2px; border-radius: 2px; background: rgba(251, 243, 238, 0.25); overflow: hidden; }
      #splash .bar i { display: block; height: 100%; background: #F7B9C6; transform-origin: left; animation: splash-bar 3s linear both; }
      #splash .rise { animation: splash-rise 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
      #splash .rise:nth-child(2) { animation-delay: 0.15s; }
      #splash .rise:nth-child(3) { animation-delay: 0.3s; }
      @keyframes splash-zoom { from { transform: scale(1.08); } to { transform: scale(1); } }
      @keyframes splash-bar { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      @keyframes splash-rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) {
        #splash img, #splash .rise { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <img src="/splash/folake-feathers.jpg" alt="" />
      <div class="veil"></div>
      <div class="copy">
        <div class="eyebrow rise">A Golden Jubilee · Lagos Edition</div>
        <div class="mark rise"><em>Flakes</em><span>@50</span></div>
        <div class="dates rise">4 – 8 November 2026</div>
        <div class="bar"><i></i></div>
      </div>
    </div>
    <script>
      // Hold the launch screen for three seconds (tap skips it), then fade
      // it out and remove it. Organizer pages open straight to the app.
      (function () {
        var el = document.getElementById("splash");
        if (location.pathname.indexOf("/admin") === 0) { el.remove(); return; }
        var root = document.documentElement;
        root.classList.add("splashing");
        var meta = document.querySelector('meta[name="theme-color"]');
        var appColor = meta && meta.getAttribute("content");
        if (meta) meta.setAttribute("content", "#9EC9BE");
        var done = false;
        function hide() {
          if (done) return;
          done = true;
          if (meta) meta.setAttribute("content", appColor);
          root.classList.remove("splashing");
          el.classList.add("out");
          setTimeout(function () { el.remove(); }, 700);
        }
        setTimeout(hide, 3000);
        el.addEventListener("click", hide);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

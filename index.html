<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F3F2EF" />
    <script>
      // Light is the default; apply dark before first paint only when the
      // guest chose it with the header toggle.
      (function () {
        try {
          var t = localStorage.getItem("theme") === "dark" ? "dark" : "light";
          document.documentElement.setAttribute("data-theme", t);
          if (t === "dark") {
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute("content", "#0F0E0D");
          }
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="https://aqjkxcuczeldfleibtzd.supabase.co/storage/v1/object/public/branding/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Folake@50" />
    <title>Folake@50</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
